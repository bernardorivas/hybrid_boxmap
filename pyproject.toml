[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-dynamics"
version = "0.2.0"
description = "Suspension grids, Morse graphs, and Conley indices of hybrid dynamical systems"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "bernardorivas", email = "bernardo.apr@gmail.com"}
]
keywords = [
    "hybrid systems",
    "dynamical systems", 
    "differential equations",
    "event detection",
    "trajectory analysis",
    "scientific computing",
    "mathematics",
    "simulation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "networkx>=2.5.0",
    "psutil>=5.8.0",
]

[project.optional-dependencies]
all = [
    "pygraphviz>=1.7",    # Morse graph visualization
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/bernardorivas/hybrid_boxmap"
Repository = "https://github.com/bernardorivas/hybrid_boxmap"
Documentation = "https://github.com/bernardorivas/hybrid_boxmap#readme"
"Bug Reports" = "https://github.com/bernardorivas/hybrid_boxmap/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_dynamics*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["hybrid_dynamics/tests", "test"]
pythonpath = ["."]
